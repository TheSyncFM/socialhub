<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialHub — TheSyncFM</title>
<link rel="stylesheet" href="/style.css">
<style>
#publicApp{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(900px 500px at 12% 0%,rgba(46,205,140,.20),transparent 55%),radial-gradient(900px 600px at 88% 15%,rgba(139,92,246,.24),transparent 58%),linear-gradient(135deg,#071a16 0%,#0b1415 42%,#15102a 100%)}
.public-page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;object-fit:cover;opacity:.14;filter:saturate(1.05) contrast(1.02) blur(.35px);transform:scale(1.025);mix-blend-mode:screen}
.public-page-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(135deg,rgba(6,37,28,.20),rgba(10,13,19,.38) 45%,rgba(45,17,74,.24) 100%)}
.public-wrap{position:relative;z-index:2}
.hero{position:relative}
.hero-avatar-img{object-fit:cover}
.public-link{position:relative;overflow:hidden;isolation:isolate}
.public-link .banner-image{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.015);filter:saturate(1.15) contrast(1.04);opacity:.96;transition:transform .45s ease,filter .45s ease}
.public-link .banner-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(5,9,12,.38),rgba(8,10,15,.20) 46%,rgba(8,10,15,.18));transition:opacity .45s ease}
.public-link .public-glow{position:absolute;inset:0;z-index:1;opacity:.20;transition:opacity .45s ease}
.public-icon,.public-copy,.public-arrow{position:relative;z-index:3}
.public-copy>span{color:#eef1f6!important;font-size:12px!important;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.public-copy strong{font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.public-copy .public-eyebrow{color:rgba(255,255,255,.78)!important}
.public-icon{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center}
.public-icon img{width:30px!important;height:30px!important;object-fit:contain;display:block}
.public-arrow{color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.public-link:hover .banner-image{transform:scale(1.07);filter:saturate(1.28) brightness(1.08)}
.public-link:hover .banner-overlay{opacity:.82}
.public-link:hover .public-glow{opacity:.38}
@media(max-width:640px){.public-icon{width:44px;height:44px;flex-basis:44px}.public-icon img{width:28px!important;height:28px!important}}
</style>
</head>
<body>
<div id="publicApp">
  <img class="public-page-bg" id="publicPageBg" alt="" aria-hidden="true">
  <div class="public-page-overlay" aria-hidden="true"></div>
  <div class="public-wrap">
    <div class="public-top"><div class="logo"><span class="logo-dot"></span>TheSyncFM</div><span class="live-pill">● LIVE INFO</span></div>
    <section class="hero" id="profileHero">
      <div class="hero-avatar-wrap"><div id="publicAvatarFallback" class="hero-avatar">TS</div><img id="publicAvatar" class="hero-avatar-img" alt="Profilo TheSyncFM" hidden></div>
      <h1 id="publicTitle">TheSyncFM</h1><p id="publicBio">Seguici su tutti i nostri canali.</p>
    </section>
    <div class="link-grid" id="publicLinks"></div>
    <footer>SocialHub · TheSyncFM</footer>
  </div>
</div>
<script>
const socials=[
{id:"instagram",label:"Instagram",description:"Seguimi su Instagram",icon:"/assets/icons/instagram.svg",href:"#",theme:"instagram",eyebrow:"SOCIAL",banner:"/assets/banners/instagram.png"},
{id:"youtube1",label:"YouTube",description:"Iscriviti al canale principale",icon:"/assets/icons/youtube.svg",href:"#",theme:"youtube",eyebrow:"CANALE 01",banner:"/assets/banners/youtube.png"},
{id:"youtube2",label:"YouTube",description:"Iscriviti al secondo canale",icon:"/assets/icons/youtube.svg",href:"#",theme:"youtube",eyebrow:"CANALE 02",banner:"/assets/banners/youtube.png"},
{id:"twitch",label:"Twitch",description:"Seguimi e guarda la LIVE",icon:"/assets/icons/twitch.svg",href:"https://www.twitch.tv/thesyncfm",theme:"twitch",eyebrow:"LIVE STREAM",banner:"/assets/banners/twitch.png"},
{id:"kick",label:"Kick",description:"Seguimi su Kick",icon:"/assets/icons/kick.svg",href:"#",theme:"kick",eyebrow:"LIVE STREAM",banner:"/assets/banners/kick.png"},
{id:"tiktok",label:"TikTok",description:"Seguimi su TikTok",icon:"/assets/icons/tiktok.svg",href:"#",theme:"tiktok",eyebrow:"SHORT CONTENT",banner:"/assets/banners/tiktok.png"},
{id:"x",label:"X",description:"Seguimi su X",icon:"/assets/icons/x-twitter.svg",href:"#",theme:"x",eyebrow:"SOCIAL",banner:"/assets/banners/x.png"}
];
let config={page:{},socials:{},updatedAt:0};
const $=id=>document.getElementById(id);
const mediaUrl=key=>`/api/media/${encodeURIComponent(key)}?v=${Date.now()}`;
function esc(v){return String(v??"").replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
async function loadConfig(){
  try{const r=await fetch('/api/config',{cache:'no-store'});const d=await r.json();if(r.ok&&d.ok)config=d.config||config;}catch(e){console.warn(e)}
  renderPublic();
}
function renderPublic(){
  $("publicTitle").textContent=config.page?.title||'TheSyncFM';
  $("publicBio").textContent=config.page?.bio||'Seguici su tutti i nostri canali.';
  const c=$("publicLinks");
  c.innerHTML=socials.map(s=>{
    const cfg=config.socials?.[s.id]||{};const href=(cfg.href??s.href).trim()||'#';const desc=(cfg.description??s.description).trim()||'Seguimi';
    const key='banner-'+s.id; const custom=mediaUrl(key); const external=/^https?:\/\//i.test(href);
    return `<a class="public-link ${s.theme}" href="${esc(href)}" ${external?'target="_blank" rel="noopener noreferrer"':''} aria-label="${esc(s.label)}"><img class="banner-image" src="${custom}" data-fallback="${s.banner}" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.removeAttribute('data-fallback')}" alt="" aria-hidden="true"><span class="banner-overlay" aria-hidden="true"></span><span class="public-glow" aria-hidden="true"></span><span class="public-icon" aria-hidden="true"><img src="${s.icon}" alt=""></span><span class="public-copy"><small class="public-eyebrow">${s.eyebrow}</small><strong>${esc(s.label)}</strong><span>${esc(desc)}</span></span><span class="public-arrow" aria-hidden="true">→</span></a>`
  }).join('');
  loadProfileMedia();
}
function loadProfileMedia(){
  const avatar=$("publicAvatar"),fallback=$("publicAvatarFallback");
  avatar.src=mediaUrl('profile-avatar');
  avatar.onload=()=>{avatar.hidden=false;fallback.hidden=true};
  avatar.onerror=()=>{avatar.hidden=true;fallback.hidden=false};
  const bg=$("publicPageBg");
  bg.src=mediaUrl('profile-cover');
  bg.onload=()=>{bg.style.display='block'};
  bg.onerror=()=>{bg.style.display='none'};
}
loadConfig();
setInterval(loadConfig,15000);
</script>
</body></html>
