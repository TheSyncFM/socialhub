<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialHub — TheSyncFM</title>
<link rel="stylesheet" href="/style.css">
<style>
#publicApp{min-height:100vh;position:relative;overflow:hidden;background:#06080d}
.public-page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:#06080d center/cover no-repeat;opacity:.13;filter:saturate(.9) blur(.2px);transform:scale(1.02)}
.public-page-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,8,13,.72),rgba(6,8,13,.90))}
.public-wrap{position:relative;z-index:2}
.hero{position:relative}
.hero-avatar-img{object-fit:cover}
.public-link{position:relative;overflow:hidden;isolation:isolate}
.public-link .banner-image{position:absolute;left:120px;right:0;top:0;bottom:0;z-index:-3;background-image:var(--banner-image);background-position:center;background-size:cover;transform:scale(1.01);transition:transform .45s ease,filter .45s ease}
.public-link .banner-overlay{position:absolute;left:120px;right:0;top:0;bottom:0;z-index:-2;background:linear-gradient(90deg,rgba(12,15,22,.95) 0%,rgba(12,15,22,.80) 38%,rgba(12,15,22,.48) 100%);transition:opacity .45s ease}
.public-link .public-glow{position:absolute;left:120px;right:0;top:0;bottom:0;z-index:-1;opacity:.45;transition:opacity .45s ease}
.public-link:hover .banner-image{transform:scale(1.07);filter:saturate(1.12) brightness(1.08)}
.public-link:hover .banner-overlay{opacity:.88}
.public-link:hover .public-glow{opacity:.75}
.public-copy>span{color:#d1d7e0!important;font-size:12px!important}
.public-copy strong{font-weight:800}
.public-icon{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center}
.public-icon img{width:30px!important;height:30px!important;object-fit:contain;display:block}
@media(max-width:640px){.public-link .banner-image,.public-link .banner-overlay,.public-link .public-glow{left:108px}.public-icon{width:44px;height:44px;flex-basis:44px}.public-icon img{width:28px!important;height:28px!important}}
</style>
</head>
<body>
<div id="publicApp">
  <div class="public-page-bg" id="publicPageBg" aria-hidden="true"></div>
  <div class="public-page-overlay" aria-hidden="true"></div>
  <div class="public-wrap">
    <div class="public-top"><div class="logo"><span class="logo-dot"></span>TheSyncFM</div><span class="live-pill">● LIVE INFO</span></div>
    <section class="hero" id="profileHero">
      <div class="hero-avatar-wrap"><div id="publicAvatarFallback" class="hero-avatar">TS</div><img id="publicAvatar" class="hero-avatar-img" alt="Profilo TheSyncFM" hidden></div>
      <h1 id="publicTitle">TheSyncFM</h1><p id="publicBio">Seguici su tutti i nostri canali.</p>
    </section>
    <div class="link-grid" id="publicLinks"></div>
    <footer>SocialHub · TheSyncFM</footer>
  </div>
</div>
<script>
const socials=[
{id:"instagram",label:"Instagram",description:"Seguimi su Instagram",icon:"/assets/icons/instagram.svg",href:"#",theme:"instagram",eyebrow:"SOCIAL",banner:"/assets/banners/instagram.png"},
{id:"youtube1",label:"YouTube",description:"Iscriviti al canale principale",icon:"/assets/icons/youtube.svg",href:"#",theme:"youtube",eyebrow:"CANALE 01",banner:"/assets/banners/youtube.png"},
{id:"youtube2",label:"YouTube",description:"Iscriviti al secondo canale",icon:"/assets/icons/youtube.svg",href:"#",theme:"youtube",eyebrow:"CANALE 02",banner:"/assets/banners/youtube.png"},
{id:"twitch",label:"Twitch",description:"Seguimi e guarda le LIVE",icon:"/assets/icons/twitch.svg",href:"https://www.twitch.tv/thesyncfm",theme:"twitch",eyebrow:"LIVE STREAM",banner:"/assets/banners/twitch.png"},
{id:"kick",label:"Kick",description:"Seguimi su Kick",icon:"/assets/icons/kick.svg",href:"#",theme:"kick",eyebrow:"LIVE STREAM",banner:"/assets/banners/kick.png"},
{id:"tiktok",label:"TikTok",description:"Seguimi su TikTok",icon:"/assets/icons/tiktok.svg",href:"#",theme:"tiktok",eyebrow:"SHORT CONTENT",banner:"/assets/banners/tiktok.png"},
{id:"x",label:"X",description:"Seguimi su X",icon:"/assets/icons/x-twitter.svg",href:"#",theme:"x",eyebrow:"SOCIAL",banner:"/assets/banners/x.png"}
];
let config={page:{},socials:{},media:{},updatedAt:0};
const $=id=>document.getElementById(id);
const mediaUrl=key=>`/api/media/${encodeURIComponent(key)}?v=${Date.now()}`;
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
async function loadConfig(){
  try{const r=await fetch('/api/config',{cache:'no-store'});const d=await r.json();if(r.ok&&d.ok)config=d.config||config;}catch(e){console.warn(e)}
  renderPublic(); loadMedia();
}
function renderPublic(){
  $("publicTitle").textContent=config.page?.title||'TheSyncFM';
  $("publicBio").textContent=config.page?.bio||'Seguici su tutti i nostri canali.';
  const c=$("publicLinks");
  c.innerHTML=socials.map(s=>{const cfg=config.socials?.[s.id]||{};const href=(cfg.href??s.href).trim()||'#';const desc=(cfg.description??s.description).trim()||'Seguimi';const bg=mediaUrl('banner-'+s.id);const external=/^https?:\/\//i.test(href);return `<a class="public-link ${s.theme}" href="${esc(href)}" style="--banner-image:url('${bg}')" ${external?'target="_blank" rel="noopener noreferrer"':''} aria-label="${esc(s.label)}"><span class="banner-image" aria-hidden="true"></span><span class="banner-overlay" aria-hidden="true"></span><span class="public-glow" aria-hidden="true"></span><span class="public-icon" aria-hidden="true"><img src="${s.icon}" alt=""></span><span class="public-copy"><small class="public-eyebrow">${s.eyebrow}</small><strong>${esc(s.label)}</strong><span>${esc(desc)}</span></span>${s.id==='twitch'?'<span class="banner-tag">LIVE</span>':''}<span class="public-arrow" aria-hidden="true">→</span></a>`}).join('');
}
function loadMedia(){
 const avatar=$("publicAvatar"),fallback=$("publicAvatarFallback");
 const a=new Image();a.onload=()=>{avatar.src=mediaUrl('profile-avatar');avatar.hidden=false;fallback.hidden=true};a.onerror=()=>{avatar.hidden=true;fallback.hidden=false};a.src=mediaUrl('profile-avatar');
 const bg=$("publicPageBg"); const b=new Image(); b.onload=()=>{bg.style.backgroundImage=`url('${mediaUrl('profile-cover')}')`;bg.style.opacity='.13'};b.onerror=()=>{bg.style.backgroundImage='none'};b.src=mediaUrl('profile-cover');
}
loadConfig();
setInterval(loadConfig,10000);
</script>
</body></html>
